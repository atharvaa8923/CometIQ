name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cometiq, POSTGRES_PASSWORD: cometiq, POSTGRES_DB: cometiq_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cometiq" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Tests (${{ matrix.database }})
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cometiq:cometiq@localhost:5432/cometiq_test' || '' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npx tsc --noEmit -p . && npm run build
        working-directory: frontend
